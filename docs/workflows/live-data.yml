name: live-data

# 10분 간격으로 실제 시세(네이버 금융)와 뉴스(Google News RSS)를 수집해 data/*.json 을 갱신합니다.
# GitHub Actions 스케줄은 UTC 기준입니다. (KST = UTC+9)
# 정각(:00)은 스케줄러 부하가 커서 분을 어긋나게 지정했습니다.
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect live market and news data
        run: python3 scripts/collect_live_data.py

      - name: Commit updated data
        run: |
          git config user.name "stock-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market_latest.json data/news_latest.json
          changed=$(python3 -c "import json;print(str(json.load(open('data/.last_run.json'))['changed']).lower())")
          last=$(git log -1 --format=%ct -- data/market_latest.json 2>/dev/null || echo 0)
          now=$(date +%s)
          if git diff --cached --quiet; then
            echo "no staged changes"
          elif [ "$changed" = "true" ] || [ $((now - last)) -gt 1800 ]; then
            git commit -m "chore(data): live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no meaningful change — skip commit"
          fi
