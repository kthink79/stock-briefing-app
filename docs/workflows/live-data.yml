name: live-data

# 10분마다 실제 시세(네이버 금융)와 뉴스(Google News RSS)를 수집해 data/*.json 을 갱신합니다.
# GitHub Actions 스케줄은 UTC 기준입니다. (KST = UTC+9)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect live market & news data
        run: python3 scripts/collect_live_data.py

      - name: Commit updated data
        run: |
          git config user.name "stock-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market_latest.json data/news_latest.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
