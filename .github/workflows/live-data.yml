{"name":"live-data","on":{"schedule":[{"cron":"*/10 * * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"concurrency":{"group":"live-data","cancel-in-progress":false},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Setup Python","uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"Collect live market and news","run":"python3 scripts/collect_live_data.py"},{"name":"Commit updated data","run":"git config user.name stock-briefing-bot\ngit config user.email actions@users.noreply.github.com\ngit add data/market_latest.json data/news_latest.json\nchanged=$(python3 -c \"import json;print(str(json.load(open('data/.last_run.json'))['changed']).lower())\")\nlast=$(git log -1 --format=%ct -- data/market_latest.json 2>/dev/null || echo 0)\nnow=$(date +%s)\nif git diff --cached --quiet; then echo no-staged-changes;\nelif [ \"$changed\" = \"true\" ] || [ $((now-last)) -gt 1800 ]; then git commit -m \"chore(data): live update $(date -u +%Y-%m-%dT%H:%MZ)\" && git push;\nelse echo skip-no-change; fi"}]}}}
